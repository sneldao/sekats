{{define "page-review"}}
<h1>Review Queue</h1>
<p class="subtitle">Real hands where the agent's action and the shadow-LLM review disagreed. A human calls it.</p>

<section class="grid" data-testid="review-counts">
  <div class="card"><h3>Pending</h3><p class="big-number">{{.Pending}}</p></div>
  <div class="card"><h3>Accepted (agent right)</h3><p class="big-number">{{.Accepted}}</p></div>
  <div class="card"><h3>Rejected (LLM right)</h3><p class="big-number">{{.Rejected}}</p></div>
</section>

<div id="review-list" data-testid="review-list">
  {{range .Items}}{{template "review-row" .}}{{end}}
</div>
{{end}}
