{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Sekats</title>
  <meta name="theme-color" content="#141118">
  <meta name="description" content="Human accountability layer for autonomous agents on Monad — adjudicated disputes, wallet-signed policy anchors, permissionless jury, client-side verification.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:site_name" content="sekats">
  <meta property="og:title" content="sekats — agent accountability console">
  <meta property="og:description" content="Disputed agent decisions become EIP-712-signed, on-chain policy anchors on Monad. Verifiable by anyone.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://console.sekats.thisyearnofear.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/htmx/htmx.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <span class="brand">Sekats</span>
    <a href="/" data-nav="quality">Quality Surface</a>
    <a href="/policy" data-nav="policy">Policy-as-ACs</a>
    <a href="/review" data-nav="review">Review Queue</a>
    <a href="/promotions" data-nav="promotions">Promotions</a>
    <a href="/anchors" data-nav="anchors">Anchors</a>
    <a href="/trends" data-nav="trends">Trends</a>
    <a href="/verdicts" data-nav="verdicts">Verdict Report</a>
    <a class="nav-ext" href="https://sekats.thisyearnofear.com">the parlor ↗</a>
  </nav>
  <main class="content">
    {{.Body}}
  </main>
  <script>
    (function () {
      var p = location.pathname;
      document.querySelectorAll(".topnav a[data-nav]").forEach(function (a) {
        if (a.getAttribute("href") === p) a.classList.add("active");
      });
    })();
  </script>
</body>
</html>
{{end}}
