{{define "promotion-counts-inner"}}
  <div class="card"><h3>Staged</h3><p class="big-number">{{.Pending}}</p></div>
  <div class="card"><h3>Approved (patch ready)</h3><p class="big-number">{{.Approved}}</p></div>
  <div class="card"><h3>Discarded</h3><p class="big-number">{{.Discarded}}</p></div>
  <div class="card"><h3>Threshold</h3><p class="big-number">{{.Threshold}}</p><p class="muted">rejections per pattern before a draft is auto-staged</p></div>
{{end}}
